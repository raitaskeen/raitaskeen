<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Analysis Sample">
  <style>
    .glow { animation: glow 7s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
    .flow { animation: flow 9s linear infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.8; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .breathe { animation: breathe 8s ease-in-out infinite; } @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>
  <defs>
    <pattern id="bg-card-sample" width="48" height="42" patternUnits="userSpaceOnUse">
          <circle cx="0" cy="0" r="2" fill="#1FA383" fill-opacity="0.45"/>
          <circle cx="24" cy="21" r="2" fill="#1FA383" fill-opacity="0.45"/>
          <path d="M0 0 L24 21 L48 0" fill="none" stroke="#1FA383" stroke-opacity="0.18"/></pattern>
    <radialGradient id="halo-card-sample" cx="0.8" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#1FA383" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1FA383" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-card-sample"><rect x="0.5" y="0.5" width="559" height="319" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="319" rx="20" fill="#121211" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <g clip-path="url(#clip-card-sample)">
    <rect class="breathe" x="-48" y="-42" width="656" height="404" fill="url(#bg-card-sample)"/>
    <rect class="glow" width="560" height="320" fill="url(#halo-card-sample)"/>
  </g>
  <text x="28" y="66" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#1FA383">04 · PUBLIC SAMPLE</text>
  <text x="28" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" fill="#F5F5F3">Analysis Sample</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9E9E98">
    <tspan x="28" y="162">Control-flow graphs, reachability and</tspan>
    <tspan x="28" y="182">invariant checks from the engine's core.</tspan>
  </text>
  <line x1="28" y1="250" x2="532" y2="250" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <text x="28" y="282" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D9D9D4">github.com/LegacyExodus/legacyexodus-analysis-sample →</text>
  <g transform="translate(360 90)" stroke="#1FA383" stroke-width="1.6" fill="none">
        <path class="flow" d="M10 20 L80 20 L120 70 L80 120 L10 120 L-30 70 Z" stroke-dasharray="6 6"/>
        <line x1="10" y1="20" x2="80" y2="120"/><line x1="80" y1="20" x2="10" y2="120"/>
        <circle cx="10" cy="20" r="7" fill="#1FA383"/><circle cx="80" cy="20" r="7" fill="#1FA383"/>
        <circle cx="120" cy="70" r="7" fill="#1FA383"/><circle cx="80" cy="120" r="7" fill="#1FA383"/>
        <circle cx="10" cy="120" r="7" fill="#1FA383"/><circle cx="-30" cy="70" r="7" fill="#1FA383"/>
      </g>
</svg>
