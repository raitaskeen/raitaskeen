<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Analysis Sample">
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
    .draw { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow { animation: flow 9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -120; } }
  </style>
  <rect x="0.5" y="0.5" width="559" height="319" rx="20" fill="#151514" stroke="#F5F5F3" stroke-opacity="0.09"/>
  
  <text x="28" y="66" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#138A6A">05 · PUBLIC SAMPLE</text>
  <text x="28" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" fill="#F5F5F3">Analysis Sample</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9E9E98">
    <tspan x="28" y="162">Control-flow graphs, reachability and</tspan>
    <tspan x="28" y="182">invariant checks from the engine's core.</tspan>
  </text>
  <line x1="28" y1="250" x2="532" y2="250" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <text x="28" y="282" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D9D9D4">github.com/LegacyExodus/legacyexodus-analysis-sample →</text>
  <g transform="translate(360 90)" stroke="#138A6A" stroke-width="1.6" fill="none">
        <path class="flow" d="M10 20 L80 20 L120 70 L80 120 L10 120 L-30 70 Z" stroke-dasharray="6 6"/>
        <line x1="10" y1="20" x2="80" y2="120"/><line x1="80" y1="20" x2="10" y2="120"/>
        <circle cx="10" cy="20" r="7" fill="#138A6A"/><circle cx="80" cy="20" r="7" fill="#138A6A"/>
        <circle cx="120" cy="70" r="7" fill="#138A6A"/><circle cx="80" cy="120" r="7" fill="#138A6A"/>
        <circle cx="10" cy="120" r="7" fill="#138A6A"/><circle cx="-30" cy="70" r="7" fill="#138A6A"/>
      </g>
</svg>
