<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Annemarie-Schimmel-Haus">
  <style>
    .glow { animation: glow 7s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
    .flow { animation: flow 9s linear infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.8; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .rise { animation: rise 12s linear infinite; } @keyframes rise { from { transform: translate(0,0); } to { transform: translate(0,70px); } }
  </style>
  <defs>
    <pattern id="bg-card-ash-site" width="70" height="70" patternUnits="userSpaceOnUse">
          <path d="M10 70 L10 35 Q10 10 35 10 Q60 10 60 35 L60 70" fill="none" stroke="#2F7D4F" stroke-opacity="0.22" stroke-width="1"/></pattern>
    <radialGradient id="halo-card-ash-site" cx="0.8" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#2F7D4F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2F7D4F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-card-ash-site"><rect x="0.5" y="0.5" width="559" height="319" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="319" rx="20" fill="#121211" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <g clip-path="url(#clip-card-ash-site)">
    <rect class="rise" x="0" y="-70" width="560" height="460" fill="url(#bg-card-ash-site)"/>
    <rect class="glow" width="560" height="320" fill="url(#halo-card-ash-site)"/>
  </g>
  <text x="28" y="66" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#2F7D4F">03 · LIVE WEBSITE</text>
  <text x="28" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" fill="#F5F5F3">Annemarie-Schimmel-Haus</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9E9E98">
    <tspan x="28" y="162">Bilingual website for a German centre</tspan>
    <tspan x="28" y="182">in Lahore, with a staff workspace.</tspan>
  </text>
  <line x1="28" y1="250" x2="532" y2="250" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <text x="28" y="282" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D9D9D4">annemarie-schimmel.raitaskeen.workers.dev →</text>
  <g transform="translate(398 92) scale(0.8)">
        <path d="M0 200 L0 60 Q0 0 60 0 Q120 0 120 60 L120 200 Z" fill="none" stroke="#2F7D4F" stroke-width="1.6"/>
        <path d="M14 200 L14 66 Q14 18 60 18 Q106 18 106 66 L106 200" fill="#2F7D4F" fill-opacity="0.14"/>
        <circle class="pulse" cx="60" cy="96" r="22" fill="#C9A227" fill-opacity="0.85"/>
        <line x1="-30" y1="200" x2="150" y2="200" stroke="#2F7D4F" stroke-width="1.2"/>
      </g>
</svg>
