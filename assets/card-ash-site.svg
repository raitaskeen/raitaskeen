        <path d="M14 200 L14 66 Q14 18 60 18 Q106 18 106 66 L106 200" fill="#2F5D3A" fill-opacity="0.12"/>
        <circle class="pulse" cx="60" cy="96" r="22" fill="#C9A227" fill-opacity="0.85"/>
        <line x1="-30" y1="200" x2="150" y2="200" stroke="#2F5D3A" stroke-width="1.2"/>
