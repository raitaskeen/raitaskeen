<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Raavi Volt">
  <style>
    .glow { animation: glow 3s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    .flow { animation: flow 3s linear infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .flicker { animation: flicker 1.6s steps(1, end) infinite; } @keyframes flicker { 0%, 62% { opacity: 1; } 66% { opacity: 0.35; } 70% { opacity: 1; } 86% { opacity: 0.5; } 90%, 100% { opacity: 1; } }
  </style>
  <defs>
    <pattern id="bg-card-raavi" width="34" height="34" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="6" height="34" fill="#E8612C" fill-opacity="0.16"/></pattern>
    <radialGradient id="halo-card-raavi" cx="0.8" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#E8612C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E8612C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-card-raavi"><rect x="0.5" y="0.5" width="559" height="319" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="319" rx="20" fill="#121211" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <g clip-path="url(#clip-card-raavi)">
    <rect class="flicker" x="0" y="0" width="560" height="320" fill="url(#bg-card-raavi)"/>
    <rect class="glow" width="560" height="320" fill="url(#halo-card-raavi)"/>
  </g>
  <text x="28" y="66" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#E8612C">02 · LIVE STORE</text>
  <text x="28" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" fill="#F5F5F3">Raavi Volt</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9E9E98">
    <tspan x="28" y="162">Electrical appliances for Lahore.</tspan>
    <tspan x="28" y="182">Payments, orders and admin in one place.</tspan>
  </text>
  <line x1="28" y1="250" x2="532" y2="250" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <text x="28" y="282" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D9D9D4">amirstore.tech →</text>
  <g transform="translate(380 92)">
        <path class="pulse" d="M70 0 L10 96 L58 96 L40 168 L110 66 L62 66 Z" fill="#E8612C" fill-opacity="0.92"/>
      </g>
</svg>
