  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9E9E98">
    <tspan x="28" y="162">Electrical appliances for Lahore.</tspan>
    <tspan x="28" y="182">Payments, orders and admin in one place.</tspan>
  </text>
