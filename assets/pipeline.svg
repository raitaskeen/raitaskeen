<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="LegacyExodus pipeline: discovery and understanding built, transformation and validation planned">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8D8D89"/>
    </marker>
  </defs>
  <rect width="1200" height="230" rx="16" fill="#F7F7F5"/>
  <text x="40" y="44" font-family="JetBrains Mono, Consolas, monospace" font-size="15" letter-spacing="2" fill="#5F5F5B">LEGACYEXODUS · PIPELINE</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Built stages -->
    <rect x="40" y="70" width="250" height="120" rx="14" fill="#138A6A"/>
    <text x="60" y="104" font-size="22" font-weight="700" fill="#FFFFFF">1 · Discovery</text>
    <text x="60" y="132" font-size="14" fill="#E6F4EF">Inventory, parse and</text>
    <text x="60" y="152" font-size="14" fill="#E6F4EF">extract symbols</text>
    <text x="60" y="178" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">✓ BUILT</text>

    <rect x="330" y="70" width="250" height="120" rx="14" fill="#138A6A"/>
    <text x="350" y="104" font-size="22" font-weight="700" fill="#FFFFFF">2 · Understanding</text>
    <text x="350" y="132" font-size="14" fill="#E6F4EF">Control-flow, data-flow</text>
    <text x="350" y="152" font-size="14" fill="#E6F4EF">and knowledge graphs</text>
    <text x="350" y="178" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">✓ BUILT</text>

    <!-- Planned stages -->
    <rect x="620" y="70" width="250" height="120" rx="14" fill="#FFFFFF" stroke="#B24418" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="640" y="104" font-size="22" font-weight="700" fill="#1E1E1E">3 · Transformation</text>
    <text x="640" y="132" font-size="14" fill="#3D3D3D">Migration plans and</text>
    <text x="640" y="152" font-size="14" fill="#3D3D3D">source changes</text>
    <text x="640" y="178" font-size="13" font-weight="700" fill="#B24418" letter-spacing="1">PLANNED</text>

    <rect x="910" y="70" width="250" height="120" rx="14" fill="#FFFFFF" stroke="#B24418" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="930" y="104" font-size="22" font-weight="700" fill="#1E1E1E">4 · Validation</text>
    <text x="930" y="132" font-size="14" fill="#3D3D3D">Behaviour checks and</text>
    <text x="930" y="152" font-size="14" fill="#3D3D3D">evidence before release</text>
    <text x="930" y="178" font-size="13" font-weight="700" fill="#B24418" letter-spacing="1">PLANNED</text>
  </g>

  <g stroke="#8D8D89" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="290" y1="130" x2="326" y2="130"/>
    <line x1="580" y1="130" x2="616" y2="130"/>
    <line x1="870" y1="130" x2="906" y2="130"/>
  </g>
</svg>
