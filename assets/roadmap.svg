<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Roadmap: build bars and first-revenue markers for three LegacyExodus products">
  <rect width="1200" height="390" rx="16" fill="#F7F7F5"/>
  <text x="40" y="44" font-family="JetBrains Mono, Consolas, monospace" font-size="15" letter-spacing="2" fill="#5F5F5B">ROADMAP · MONTHS FROM START</text>

  <!-- month grid -->
  <g stroke="#1E1E1E" stroke-opacity="0.08">
    <line x1="180" y1="70" x2="180" y2="310"/>
    <line x1="260" y1="70" x2="260" y2="310"/>
    <line x1="340" y1="70" x2="340" y2="310"/>
    <line x1="420" y1="70" x2="420" y2="310"/>
    <line x1="500" y1="70" x2="500" y2="310"/>
    <line x1="580" y1="70" x2="580" y2="310"/>
    <line x1="660" y1="70" x2="660" y2="310"/>
    <line x1="740" y1="70" x2="740" y2="310"/>
    <line x1="820" y1="70" x2="820" y2="310"/>
    <line x1="900" y1="70" x2="900" y2="310"/>
    <line x1="980" y1="70" x2="980" y2="310"/>
    <line x1="1060" y1="70" x2="1060" y2="310"/>
    <line x1="1140" y1="70" x2="1140" y2="310"/>
  </g>
  <line x1="180" y1="312" x2="1140" y2="312" stroke="#1E1E1E" stroke-opacity="0.35"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5F5F5B" text-anchor="middle">
    <text x="180" y="334">0</text>
    <text x="420" y="334">3</text>
    <text x="660" y="334">6</text>
    <text x="900" y="334">9</text>
    <text x="1140" y="334">12</text>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- row labels -->
    <text x="40" y="92" font-size="17" font-weight="700" fill="#1E1E1E">Safety net</text>
    <text x="40" y="112" font-size="13" fill="#5F5F5B">JavaScript / TypeScript</text>
    <text x="40" y="172" font-size="17" font-weight="700" fill="#1E1E1E">Quantum-safe discovery</text>
    <text x="40" y="192" font-size="13" fill="#5F5F5B">after LegacyExodus</text>
    <text x="40" y="246" font-size="17" font-weight="700" fill="#1E1E1E">Quantum-safe</text>
    <text x="40" y="266" font-size="17" font-weight="700" fill="#1E1E1E">migration</text>
    <text x="40" y="284" font-size="13" fill="#5F5F5B">complete platform</text>

    <!-- build bars -->
    <rect x="180" y="78" width="240" height="30" rx="8" fill="#2D5BA8"/>
    <text x="300" y="98" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">build · ~3 months</text>

    <rect x="420" y="158" width="240" height="30" rx="8" fill="#2D5BA8"/>
    <text x="540" y="178" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">build · ~3 months</text>

    <rect x="180" y="238" width="640" height="30" rx="8" fill="#B24418"/>
    <text x="500" y="258" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">build · ~6–9 months</text>

    <!-- first revenue markers -->
    <polygon points="540,80 562,93 540,106 518,93" fill="#138A6A"/>
    <text x="578" y="98" font-size="13" fill="#138A6A" font-weight="700">first revenue ~4–5 months</text>

    <polygon points="1020,160 1042,173 1020,186 998,173" fill="#138A6A"/>
    <text x="1020" y="150" font-size="13" fill="#138A6A" font-weight="700" text-anchor="middle">first revenue</text>

    <text x="1130" y="262" font-size="14" font-weight="700" fill="#B24418" text-anchor="end">revenue 2027–2028 →</text>
  </g>

  <!-- legend -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5F5F5B">
    <rect x="180" y="356" width="18" height="12" rx="3" fill="#2D5BA8"/>
    <text x="206" y="366">build time</text>
    <polygon points="330,351 340,362 330,373 320,362" fill="#138A6A"/>
    <text x="352" y="366">first revenue</text>
  </g>
</svg>
