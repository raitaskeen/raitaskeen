<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="LegacyExodus">
  <style>
    .glow { animation: glow 3s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    .flow { animation: flow 3s linear infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .slide { animation: slide 4s linear infinite; } @keyframes slide { from { transform: translate(0,0); } to { transform: translate(26px,0); } }
  </style>
  <defs>
    <pattern id="bg-card-legacy" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="26" stroke="#B24418" stroke-opacity="0.22" stroke-width="1"/></pattern>
    <radialGradient id="halo-card-legacy" cx="0.8" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#B24418" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#B24418" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-card-legacy"><rect x="0.5" y="0.5" width="559" height="319" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="319" rx="20" fill="#121211" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <g clip-path="url(#clip-card-legacy)">
    <rect class="slide" x="-60" y="-60" width="680" height="440" fill="url(#bg-card-legacy)"/>
    <rect class="glow" width="560" height="320" fill="url(#halo-card-legacy)"/>
  </g>
  <text x="28" y="66" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#B24418">01 · PRIVATE PLATFORM</text>
  <text x="28" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" fill="#F5F5F3">LegacyExodus</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9E9E98">
    <tspan x="28" y="162">Deterministic analysis of legacy code.</tspan>
    <tspan x="28" y="182">Evidence first, changes second.</tspan>
  </text>
  <line x1="28" y1="250" x2="532" y2="250" stroke="#F5F5F3" stroke-opacity="0.09"/>
  <text x="28" y="282" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D9D9D4">legacyexodus.tech →</text>
  <g transform="translate(410 150)">
        <circle class="spin" r="62" fill="none" stroke="#B24418" stroke-width="1.2" stroke-dasharray="3 7"/>
        <circle r="38" fill="none" stroke="#B24418" stroke-opacity="0.55" stroke-width="1"/>
      </g>
      <g transform="translate(360 96) scale(2.1)"><path d="M4 4h5.5v18.5H28V28H4z" fill="#F5F5F3"/><path d="M12.6 19.4 20.2 11.8" stroke="#B24418" stroke-width="3" stroke-linecap="square"/><rect x="18.5" y="4" width="9.5" height="9.5" rx="1.2" fill="#B24418"/></g>
</svg>
